version: '3'

vars:
  APP_NAME: "spira"
  # O exe precisa continuar em build/bin: GetExecDir() usa os.Executable(),
  # então é de lá que saem config/config.json, data/, extracted/, translated/
  # e logs/ — e build/bin/data é o fixture primário de dezenas de testes.
  # (O default do v3 é "bin", o que mudaria a pasta de trabalho do app.)
  BIN_DIR: "build/bin"
  # Runner do frontend: era o "frontend:*" do wails.json (bun install/build/dev).
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "bun"}}'
  # Porta do dev server. O nome vem do Taskfile comum (é Vite no template);
  # aqui o dev server é o `next dev`, que aceita -p/--port.
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # Versão de release: fonte única no arquivo VERSION da raiz. Lida com node
  # (e não `cat`) porque o shell do Task no Windows (mvdan/sh) executa
  # binários diretos e não existe `cat` no PowerShell — node já é
  # pré-requisito do build (e2e e scripts/fix-wails-bindings.mjs).
  # Injeta -ldflags "-X main.currentVersion=…" nos builds de release; sem
  # ldflags o binário nasce como "dev" e o check de startup fica desligado.
  VERSION:
    sh: 'node -e "process.stdout.write(require(''fs'').readFileSync(''VERSION'',''utf8'').trim())"'
  # Binário que as tasks de build produzem (build/bin/spira[.exe]).
  BIN: '{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}}'
  # Nome do asset publicado — fonte única (release:assets e gh release create
  # leem daqui; precisa conter <goos> e <goarch> para o DefaultAssetMatcher
  # do updater achar o binário certo). Ver docs/updater.md.
  RELEASE_ASSET: 'spira-{{.VERSION}}-portable-{{OS}}-{{ARCH}}.zip'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    deps:
      # Grava a versão do VERSION em build/windows/info.json e
      # frontend/package.json ANTES do .syso e do next build nascerem.
      - task: version:sync
      # Portão de qualidade: TODO build de produção roda a suíte de testes
      # ANTES de compilar e ABORTA no primeiro teste falho — binário
      # vermelho não sai. Dep falha = task inteira para na hora.
      - task: test
    cmds:
      - task: "{{.GOOS}}:build"

  version:sync:
    summary: Sincroniza o arquivo VERSION em info.json e frontend/package.json
    desc: |
      Fonte única de versão: o arquivo VERSION na raiz. Este script grava
      build/windows/info.json (file_version/ProductVersion) e
      frontend/package.json. Idempotente. A versão que o updater enxerga vem
      dos -ldflags do build (Taskfile), não daqui. Ver docs/updater.md.
    cmds:
      - node scripts/version-sync.mjs

  release:
    summary: Publica a release vX.Y.Z no GitHub (build + zip portátil + SHA256SUMS)
    desc: |
      Fluxo (Windows — o asset portátil é <goos>-<goarch> da máquina):
        1. edite o arquivo VERSION (ex.: 2.2.0) e commite;
        2. (opcional) escreva docs/releases/2.2.0.md com o changelog — é o
           texto que a janela de atualização mostra (mesmo corpo da release
           no GitHub); sem ele a task usa --generate-notes;
        3. wails3 task release
      Exige `gh auth status` ok. Publica a tag v<VERSION> com o zip portátil
      de dist/ (um único entry de topo) e o sidecar SHA256SUMS — os dois são
      obrigatórios para o updater instalar. Contrato completo: docs/updater.md.
    deps:
      - task: version:sync
    preconditions:
      - sh: gh auth status > /dev/null 2>&1
        msg: "gh CLI não autenticado — rode: gh auth login"
      - sh: test -f VERSION
        msg: "arquivo VERSION ausente na raiz"
    env:
      VERSION: '{{.VERSION}}'
    cmds:
      - task: build
      - task: release:assets
      - cmd: |
          set -e
          if git status --porcelain | grep -q .; then
            echo "AVISO: há alterações não commitadas — a release não sai de um commit limpo."
          fi
          NOTES="docs/releases/${VERSION}.md"
          if [ -f "$NOTES" ]; then
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$NOTES" "dist/{{.RELEASE_ASSET}}" "dist/SHA256SUMS"
          else
            echo "nota: ${NOTES} não existe — usando --generate-notes (commits desde a tag anterior)"
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes "dist/{{.RELEASE_ASSET}}" "dist/SHA256SUMS"
          fi
          echo "release: https://github.com/wandersonareis/FFX_Resources/releases/tag/v${VERSION}"

  release:assets:
    summary: Gera dist/<asset>.zip (spira.exe) e dist/SHA256SUMS
    desc: |
      Zip com UM ÚNICO entry de topo (regra do maybeExtractInto do updater) e
      sidecar no formato sha256sum ("<hex>  <nome>"). Ver docs/updater.md.
    internal: true
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release-assets.ps1 -Exe "{{.BIN}}" -Asset "{{.RELEASE_ASSET}}"
        platforms: [windows]
      - cmd: 'rm -rf dist && mkdir -p dist && zip -j -q "dist/{{.RELEASE_ASSET}}" "{{.BIN}}" && (cd dist && sha256sum "{{.RELEASE_ASSET}}" > SHA256SUMS)'
        platforms: [linux, darwin]
      - cmd: cat dist/SHA256SUMS
        platforms: [linux, darwin]

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  install:e2e:
    summary: Instala o Playwright (deps do e2e/ e o navegador Chromium)
    cmds:
      - task: common:install:e2e

  test:
    summary: Roda todos os testes automatizados (backend Go + frontend bun)
    desc: |
      O portão do build de produção (dep de `build` — e por tabela de
      `release`): dep falha = task inteira aborta, nenhum binário sai de
      suíte vermelha. O e2e (Playwright) NÃO faz parte do portão — ele
      precisa do binário pronto e da porta livre; use `wails3 task
      test:e2e`. A suíte Go exige o fixture build/bin (ver comentário do
      BIN_DIR — data/ extraída é o fixture primário de dezenas de
      testes); sem ele a suíte Ginkgo de services falha no BeforeAll.
    deps:
      - task: test:backend
      - task: test:frontend

  test:backend:
    summary: go test ./... (suíte Go inteira, sem cache)
    cmds:
      - go test ./... -count=1

  test:frontend:
    summary: bun test (stores, parsers e helpers do frontend)
    dir: frontend
    preconditions:
      - sh: bun --version
        msg: "bun not found — instale em https://bun.sh (é o runner do frontend)"
    cmds:
      - bun test

  test:e2e:
    summary: Playwright E2E no app servido (builda o spira-server antes)
    preconditions:
      # A suíte NÃO reusa servidor: porta ocupada = alguém usando (app em
      # modo servidor ou run:server manual). Aborta ANTES do build — não
      # adianta buildar por cima de um exe em execução (Windows trava
      # arquivo de processo) nem testar contra um binário velho.
      - sh: |
          node -e "const net=require('net');const s=net.connect(${E2E_PORT:-9246},'127.0.0.1');s.on('connect',()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(0));setTimeout(()=>process.exit(0),2000)"
        msg: "porta ${E2E_PORT:-9246} ocupada — encerra o spira-server (ou o app em modo servidor) e reexecuta os testes"
    cmds:
      - task: common:build:server
        vars:
          DEV: "true"
      - task: common:test:e2e

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
